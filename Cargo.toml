[package]
name = "chiffre-rsa-keystore"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Vérification et classification de clés publiques RSA — aucune décision de confiance automatique"

[dependencies]
chiffre-rsa-core = { path = "../chiffre-rsa-core" }
serde = { version = "1", features = ["derive"], optional = true }

[features]
serde = ["dep:serde"]

[dev-dependencies]
serde_json = "1"
